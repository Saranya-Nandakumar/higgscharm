# H+c MVA workflow with 4-class classification
#
# This workflow extends hplusc to output all features needed for MVA training
# and inference. MVA inference is performed in post-processing using b-hive.
#
# 4-class MVA classification:
#   Class 0: qqZZ       - qq→ZZ continuum background
#   Class 1: ggZZ       - gg→ZZ continuum background
#   Class 2: Signal     - H+c signal (target)
#   Class 3: Other_Higgs - Combined: HPlusB + ggH + Other backgrounds
#
# b-hive configuration paths (set via environment or command line):
#   --bhive-config /eos/user/s/snandaku/b-hive_ttcc/config/<4class_config>.yml
#   --bhive-model /eos/user/s/snandaku/b-hive_ttcc/output/.../best_model.pt
#
# Usage:
#   python runner.py -w hplusc_mva_4class -y 2022postEE -o parquet
#   python run_postprocess.py -w hplusc_mva_4class -y 2022postEE --mva-inference
#
# Class mapping from 5-class to 4-class:
#   qqgg_toZZ -> split into qqZZ (0) and ggZZ (1)
#   Signal    -> Signal (2)
#   HPlusB    -> Other_Higgs (3)
#   ggH       -> Other_Higgs (3)
#   Other     -> Other_Higgs (3)

datasets:
  data:
    - muon
    - double_muon
    - electron
    - double_electron
    - muon_electron
  mc:
    - higgs
    - hb
    - qqtozz
    - ggtozz
    - dy_nlo
  signal:
    - smsignal

object_selection:
  muons:
    field: events.Muon
    add_cut:
      is_loose:
        - events.Muon.pt > 5
        - np.abs(events.Muon.eta) < 2.4
        - np.abs(events.Muon.dxy) < 0.5
        - np.abs(events.Muon.dz) < 1
        - events.Muon.isGlobal | events.Muon.isTracker
      is_relaxed:
        - objects['muons'].is_loose
        - np.abs(events.Muon.sip3d) < 4
      is_tight:
        - objects['muons'].is_loose
        - objects['muons'].is_relaxed
        - events.Muon.isPFcand | ((events.Muon.highPtId > 0) & (events.Muon.pt > 200))
  electrons:
    field: events.Electron
    add_cut:
      is_loose:
        - events.Electron.pt > 7
        - np.abs(events.Electron.eta) < 2.5
        - np.abs(events.Electron.dxy) < 0.5
        - np.abs(events.Electron.dz) < 1
      is_relaxed:
        - objects['electrons'].is_loose
        - np.abs(events.Electron.sip3d) < 4
      is_tight:
        - objects['electrons'].is_loose
        - objects['electrons'].is_relaxed
        - working_points.electron_id(events, 'bdt')
    cuts:
      - delta_r_higher(events.Electron, objects['muons'], 0.05)
  fsr_photons:
    field: events.FsrPhoton
    cuts:
      - events.FsrPhoton.pt > 2
      - np.abs(events.FsrPhoton.eta) < 2.4
      - events.FsrPhoton.relIso03 < 1.8
  leptons:
    field: select_zzto4l_leptons
  zcandidates:
    field: select_zcandidates
    add_cut:
      is_ossf:
        - objects['zcandidates'].l1.pdgId == -objects['zcandidates'].l2.pdgId
      is_sr:
        - objects['zcandidates'].is_ossf
        - objects['zcandidates'].l1.is_tight & objects['zcandidates'].l2.is_tight
    cuts:
      - (objects['zcandidates'].p4.mass > 12) & (objects['zcandidates'].p4.mass < 120)
  zzcandidates:
    field: select_zzcandidates
    cuts:
      - objects['zzcandidates'].z1.is_sr & objects['zzcandidates'].z2.is_sr
      - (objects['zzcandidates'].z1.p4 + objects['zzcandidates'].z2.p4).mass > 70
  best_zzcandidate:
    field: select_best_zzcandidate
  zz_mass_4mu:
    field: select_mass_4mu_sr
  zz_mass_4e:
    field: select_mass_4e_sr
  zz_mass_2mu2e:
    field: select_mass_2mu2e_sr
  zz_mass_2e2mu:
    field: select_mass_2e2mu_sr
  jets:
    field: events.Jet
    cuts:
      - events.Jet.pt > 20
      - np.abs(events.Jet.eta) < 2.5
      - working_points.jet_id(events, year, 'tightlepveto')
      - delta_r_higher(events.Jet, objects['leptons'], 0.4)
  cjets:
    field: events.Jet
    cuts:
      - events.Jet.pt > 20
      - np.abs(events.Jet.eta) < 2.5
      - working_points.jet_id(events, year, 'tightlepveto')
      - delta_r_higher(events.Jet, objects['leptons'], 0.4)
      - working_points.jet_ctagging(events, 'loose', year)
  zzcandidate_cjet_dphi_inclusive:
    field: select_dphi_inclusive
  zzcandidate_cjet_dphi_4e:
    field: select_dphi_4e
  zzcandidate_cjet_dphi_4mu:
    field: select_dphi_4mu
  zzcandidate_cjet_dphi_2mu2e:
    field: select_dphi_2mu2e
  zzcandidate_cjet_dphi_2e2mu:
    field: select_dphi_2e2mu

event_selection:
  hlt_paths:
    - SingleMu
    - DiMu
    - TriMu
    - SingleEle
    - DiEle
    - MuEle
  selections:
    trigger: get_zzto4l_trigger_mask(events, hlt_paths, dataset, year)
    lumimask: get_lumi_mask(events, year)
    atleast_one_goodvertex: events.PV.npvsGood > 0
    atleast_one_zz: ak.num(objects['zzcandidates']) >= 1
    atleast_one_cjet: ak.num(objects['cjets']) >= 1
  categories:
    base:
      - trigger
      - lumimask
      - atleast_one_goodvertex
      - atleast_one_zz
      - atleast_one_cjet

corrections:
  objects:
    - jec
    - jet_vetomaps
    - muon_ss
    - electon_ss
  event_weights:
    genWeight: true
    pileupWeight: true
    partonshowerWeight: true
    lhepdfWeight: true
    lhescaleWeight: true
    nnlopsWeight: true
    # Muon efficiency SF (ID only) -- wired 2026-08-21, closing the gap found in
    # the systematics-completeness audit (second-brain memory
    # hczz_systematics_completeness_audit / README_HcZZ.md "Open items"): no
    # ZZ->4l workflow previously had a `muon:` key at all, so the muon ID SF
    # correction (implemented and working in analysis/corrections/muon.py,
    # already used by hww.yaml) was never applied here -- a missing
    # central-value correction, not just an uncovered uncertainty.
    #   id: loose -- matches this analysis's actual muon selection
    #     (zzto4l.yaml object_selection.muons: isGlobal|isTracker (is_loose) +
    #     isPFcand (is_tight), the standard CMS H->ZZ->4l lepton recipe), NOT
    #     POG tight ID (which additionally requires normalized chi2,
    #     station-match, and tracker-layer cuts this selection never checks) --
    #     using "tight" here would apply an SF for a selection tighter than
    #     what's actually cut on, overcorrecting. correctionlib safely no-ops
    #     (SF=1) for muons below the SF binning's pT floor (10-15 GeV
    #     depending on nano version; see MuonWeights.get_id_weights/
    #     unflat_sf), so this analysis's pt>5 GeV muons are only corrected
    #     above that floor.
    #   iso: false -- deliberately NOT wired. This analysis's isolation is a
    #     bespoke FSR-photon-corrected combined relative isolation
    #     (select_zzto4l_leptons in object_selections.py), not a standard
    #     PF-relIso working point at a matching cone/threshold -- the generic
    #     NUM_*RelIso_DEN_*ID correctionlib SFs don't correspond to this cut.
    #     Applying one anyway would risk a NEW mismatch bias, not fix one;
    #     left as a documented open item rather than silently misapplied.
    #   trigger: false -- matches the electron block's own choice below and
    #     the hww.yaml sibling; a real multi-path (SingleMu/DiMu/TriMu/...)
    #     trigger SF needs combinatorial OR-of-paths efficiency modeling
    #     beyond a single flag flip -- out of scope for this pass.
    muon:
      - id: loose
      - iso: false
      - trigger: false
    electron:
      - id: false
      - reco: true
      - trigger: false
    # Switched from the 1D fixed-WP corrector (ctagging: [wp: loose]) to the 2D
    # pseudo-continuous SF, 2026-08-14 -- decision: applying both simultaneously would
    # double-count the c-tagging data/MC correction (the 2D per-category SF already
    # covers the jet's full tagger response independent of any 1D WP; a 1D SF is not
    # a "companion" correction for a matching WP, it corrects the SAME physical effect
    # via a different, WP-specific formula). Matches hww-analysis's own production
    # pattern (medium WP selection + ctagging_2d only, no 1D SF block at all). Also
    # retires the CMS_ctag_light exclusion in create_datacards.py's SYSTEMATICS --
    # the 2D scheme has no eff/(1-eff) untagged-jet formula, so it can't hit that
    # bug's negative-weight failure mode. The `atleast_one_cjet` SELECTION cut below
    # is UNCHANGED (still `working_points.jet_ctagging(events, 'loose', year)`) --
    # this is a weighting-scheme change only, not a selection change. See
    # second-brain memory hczz_pnet_ctag_sf_migration and README_HcZZ.md.
    ctagging_2d: true

# MVA configuration for post-processing (4-class)
# Pass these paths via command line:
#   --bhive-config /eos/user/s/snandaku/b-hive_ttcc/config/<4class_config>.yml
#   --bhive-model /eos/user/s/snandaku/b-hive_ttcc/output/.../best_model.pt
#
# 4-class labels: ['qqZZ', 'ggZZ', 'Signal', 'Other_Higgs']
#   - qqZZ: qq→ZZ continuum
#   - ggZZ: gg→ZZ continuum
#   - Signal: H+c signal
#   - Other_Higgs: HPlusB + ggH + Other (combined)
mva_config:
  enabled: true
  num_classes: 4
  class_names:
    - qqZZ
    - ggZZ
    - Signal
    - Other_Higgs
  class_descriptions:
    qqZZ: "qq→ZZ continuum background"
    ggZZ: "gg→ZZ continuum background"
    Signal: "H+c signal (target)"
    Other_Higgs: "Combined HPlusB + ggH + Other backgrounds"
  mass_window:
    min: 100
    max: 150

histogram_config:
  add_syst_axis: true
  add_weight: true
  axes:
    # =========================================================================
    # Standard ZZ observables
    # =========================================================================
    zz_mass_inclusive:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{4\ell}$ [GeV]
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).mass
    zz_pt_inclusive:
      type: Regular
      bins: 40
      start: 0
      stop: 400
      label: $p_T(4\ell)$ [GeV]
      expression: objects['best_zzcandidate'].p4.pt
    zz_eta_inclusive:
      type: Regular
      bins: 50
      start: -5
      stop: 5
      label: $\eta(4\ell)$
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).eta
    zz_phi_inclusive:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(4\ell)$
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).phi
    m4l:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{4\ell}$ [GeV]
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).mass
    eta_4l:
      type: Regular
      bins: 50
      start: -5
      stop: 5
      label: $\eta(4\ell)$
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).eta
    pT_4l:
      type: Regular
      bins: 40
      start: 0
      stop: 400
      label: $p_T(4\ell)$ [GeV]
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).pt
    phi_4l:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(4\ell)$
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).phi
    zz_mass_4mu:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{4\mu}$ [GeV]
      expression: objects['zz_mass_4mu']
    zz_mass_4e:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{4e}$ [GeV]
      expression: objects['zz_mass_4e']
    zz_mass_2mu2e:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{2\mu 2e}$ [GeV]
      expression: objects['zz_mass_2mu2e']
    zz_mass_2e2mu:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{2e2\mu}$ [GeV]
      expression: objects['zz_mass_2e2mu']

    # =========================================================================
    # Z boson kinematics (for MVA)
    # =========================================================================
    z1_pt:
      type: Regular
      bins: 50
      start: 0
      stop: 500
      label: $p_T(Z_1)$ [GeV]
      expression: objects['best_zzcandidate'].z1.p4.pt
    z1_eta:
      type: Regular
      bins: 50
      start: -5
      stop: 5
      label: $\eta(Z_1)$
      expression: objects['best_zzcandidate'].z1.p4.eta
    z1_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(Z_1)$
      expression: objects['best_zzcandidate'].z1.p4.phi
    z1_mass:
      type: Regular
      bins: 54
      start: 12
      stop: 120
      label: $m(Z_1)$ [GeV]
      expression: objects['best_zzcandidate'].z1.p4.mass
    z2_pt:
      type: Regular
      bins: 50
      start: 0
      stop: 500
      label: $p_T(Z_2)$ [GeV]
      expression: objects['best_zzcandidate'].z2.p4.pt
    z2_eta:
      type: Regular
      bins: 50
      start: -5
      stop: 5
      label: $\eta(Z_2)$
      expression: objects['best_zzcandidate'].z2.p4.eta
    z2_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(Z_2)$
      expression: objects['best_zzcandidate'].z2.p4.phi
    z2_mass:
      type: Regular
      bins: 54
      start: 12
      stop: 120
      label: $m(Z_2)$ [GeV]
      expression: objects['best_zzcandidate'].z2.p4.mass

    # =========================================================================
    # Combined Z arrays for MVA (2 Z bosons per event)
    # =========================================================================
    z_pt:
      type: Regular
      bins: 50
      start: 0
      stop: 300
      label: Z $p_T$ [GeV]
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.p4.pt, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.p4.pt, 0.0))])
    z_eta:
      type: Regular
      bins: 50
      start: -5
      stop: 5
      label: Z $\eta$
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.p4.eta, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.p4.eta, 0.0))])
    z_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: Z $\phi$
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.p4.phi, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.p4.phi, 0.0))])
    z_mass:
      type: Regular
      bins: 50
      start: 0
      stop: 150
      label: Z mass [GeV]
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.p4.mass, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.p4.mass, 0.0))])

    deltaR_ZZ:
      type: Regular
      bins: 50
      start: 0
      stop: 6
      label: $\Delta R(Z_1, Z_2)$
      expression: objects['best_zzcandidate'].z1.p4.delta_r(objects['best_zzcandidate'].z2.p4)

    # =========================================================================
    # Jet observables (for MVA)
    # =========================================================================
    jet_multiplicity:
      type: Integer
      start: 0
      stop: 14
      label: Jet Multiplicity
      expression: ak.num(objects['jets'])
    jet_ht:
      type: Regular
      bins: 50
      start: 0
      stop: 1000
      label: $H_T$ (Jets) [GeV]
      expression: ak.sum(objects['jets'].pt, axis=1)
    jet_pt:
      type: Regular
      bins: 50
      start: 20
      stop: 500
      label: Jets $p_T$ [GeV]
      expression: objects['jets'].pt
    jet_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: Jets $\eta$
      expression: objects['jets'].eta
    jet_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: Jets $\phi$
      expression: objects['jets'].phi
    jet_mass:
      type: Regular
      bins: 50
      start: 0
      stop: 100
      label: Jets mass [GeV]
      expression: objects['jets'].mass

    # =========================================================================
    # Jet b-tagging scores (for MVA - PNet and ParT)
    # =========================================================================
    jet_btagPNetB:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Jets PNet B
      expression: objects['jets'].btagPNetB
    jet_btagPNetCvL:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Jets PNet CvL
      expression: objects['jets'].btagPNetCvL
    jet_btagPNetCvB:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Jets PNet CvB
      expression: objects['jets'].btagPNetCvB
    jet_btagPNetQvG:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Jets PNet QvG
      expression: objects['jets'].btagPNetQvG
    jet_btagRobustParTAK4B:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Jets ParT B
      expression: objects['jets'].btagRobustParTAK4B
    jet_btagRobustParTAK4CvB:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Jets ParT CvB
      expression: objects['jets'].btagRobustParTAK4CvB
    jet_hadronFlavour:
      type: IntCategory
      categories:
        - 0
        - 4
        - 5
      label: Jets HadronFlavour
      expression: objects['jets'].hadronFlavour

    # =========================================================================
    # Leading/subleading jet scores
    # =========================================================================
    leadingjet_cvsl:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Leading Jet CvsL
      expression: ak.fill_none(ak.pad_none(objects['jets'], target=2)[:, 0].btagPNetCvL, 0.0)
    leadingjet_cvsb:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Leading Jet CvsB
      expression: ak.fill_none(ak.pad_none(objects['jets'], target=2)[:, 0].btagPNetCvB, 0.0)
    leadingjet_b:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Leading Jet B
      expression: ak.fill_none(ak.pad_none(objects['jets'], target=2)[:, 0].btagPNetB, 0.0)
    leadingjet_flavour:
      type: IntCategory
      categories:
        - 0
        - 4
        - 5
      label: Leading Jet HadronFlavour
      expression: ak.pad_none(objects['jets'], target=2)[:, 0].hadronFlavour
    subleadingjet_cvsl:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Subleading Jet CvsL
      expression: ak.fill_none(ak.pad_none(objects['jets'], target=2)[:, 1].btagPNetCvL, 0.0)
    subleadingjet_cvsb:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Subleading Jet CvsB
      expression: ak.fill_none(ak.pad_none(objects['jets'], target=2)[:, 1].btagPNetCvB, 0.0)
    subleadingjet_flavour:
      type: IntCategory
      categories:
        - 0
        - 4
        - 5
      label: Subleading Jet HadronFlavour
      expression: ak.pad_none(objects['jets'], target=2)[:, 1].hadronFlavour

    # =========================================================================
    # c-jet observables
    # =========================================================================
    n_cjet:
      type: Integer
      start: 0
      stop: 14
      label: c-Jet Multiplicity
      expression: ak.num(objects['cjets'])
    cjets_multiplicity:
      type: Integer
      start: 0
      stop: 14
      label: c-Jet Multiplicity
      expression: ak.num(objects['cjets'])
    cjet_HT:
      type: Regular
      bins: 50
      start: 0
      stop: 1000
      label: $H_T$ (c-Jets) [GeV]
      expression: ak.sum(objects['cjets'].pt, axis=1)
    cjets_pt:
      type: Regular
      bins: 50
      start: 20
      stop: 500
      label: c-Jet $p_T$ [GeV]
      expression: objects['cjets'].pt
    cjets_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: c-Jet $\eta$
      expression: objects['cjets'].eta
    cjets_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: c-Jet $\phi$
      expression: objects['cjets'].phi
    cjets_mass:
      type: Regular
      bins: 50
      start: 0
      stop: 100
      label: c-Jet mass [GeV]
      expression: objects['cjets'].mass
    cjets_btagPNetB:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: c-Jets PNet B
      expression: objects['cjets'].btagPNetB
    cjets_btagPNetCvL:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: c-Jets PNet CvL
      expression: objects['cjets'].btagPNetCvL
    cjets_btagPNetCvB:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: c-Jets PNet CvB
      expression: objects['cjets'].btagPNetCvB
    cjets_btagPNetQvG:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: c-Jets PNet QvG
      expression: objects['cjets'].btagPNetQvG
    cjets_hadronFlavour:
      type: IntCategory
      categories:
        - 0
        - 4
        - 5
      label: c-Jets HadronFlavour
      expression: objects['cjets'].hadronFlavour
    cjets_h_dphi_inclusive:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{4\ell})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_inclusive'])

    # =========================================================================
    # Secondary Vertex observables
    # =========================================================================
    nSV:
      type: Integer
      start: 0
      stop: 10
      label: Number of Secondary Vertices
      expression: ak.num(events.SV)

    # =========================================================================
    # Lepton kinematics (Z1 leptons)
    # =========================================================================
    z1_l1_pt:
      type: Regular
      bins: 50
      start: 5
      stop: 300
      label: $p_T(\ell_1^{Z_1})$ [GeV]
      expression: objects['best_zzcandidate'].z1.l1.pt
    z1_l1_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\ell_1^{Z_1})$
      expression: objects['best_zzcandidate'].z1.l1.eta
    z1_l1_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_1^{Z_1})$
      expression: objects['best_zzcandidate'].z1.l1.phi
    z1_l2_pt:
      type: Regular
      bins: 50
      start: 5
      stop: 300
      label: $p_T(\ell_2^{Z_1})$ [GeV]
      expression: objects['best_zzcandidate'].z1.l2.pt
    z1_l2_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\ell_2^{Z_1})$
      expression: objects['best_zzcandidate'].z1.l2.eta
    z1_l2_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_2^{Z_1})$
      expression: objects['best_zzcandidate'].z1.l2.phi

    # =========================================================================
    # Lepton kinematics (Z2 leptons)
    # =========================================================================
    z2_l1_pt:
      type: Regular
      bins: 50
      start: 5
      stop: 300
      label: $p_T(\ell_1^{Z_2})$ [GeV]
      expression: objects['best_zzcandidate'].z2.l1.pt
    z2_l1_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\ell_1^{Z_2})$
      expression: objects['best_zzcandidate'].z2.l1.eta
    z2_l1_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_1^{Z_2})$
      expression: objects['best_zzcandidate'].z2.l1.phi
    z2_l2_pt:
      type: Regular
      bins: 50
      start: 5
      stop: 300
      label: $p_T(\ell_2^{Z_2})$ [GeV]
      expression: objects['best_zzcandidate'].z2.l2.pt
    z2_l2_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\ell_2^{Z_2})$
      expression: objects['best_zzcandidate'].z2.l2.eta
    z2_l2_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_2^{Z_2})$
      expression: objects['best_zzcandidate'].z2.l2.phi

    # =========================================================================
    # Combined lepton arrays for MVA (4 leptons per event)
    # =========================================================================
    lepton_pt:
      type: Regular
      bins: 50
      start: 5
      stop: 300
      label: Lepton $p_T$ [GeV]
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l1.pt, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l2.pt, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l1.pt, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l2.pt, 0.0))])
    lepton_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: Lepton $\eta$
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l1.eta, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l2.eta, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l1.eta, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l2.eta, 0.0))])
    lepton_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: Lepton $\phi$
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l1.phi, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l2.phi, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l1.phi, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l2.phi, 0.0))])
    lepton_mass:
      type: Regular
      bins: 50
      start: 0
      stop: 0.2
      label: Lepton mass [GeV]
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l1.mass, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l2.mass, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l1.mass, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l2.mass, 0.0))])
    lepton_charge:
      type: Regular
      bins: 3
      start: -1.5
      stop: 1.5
      label: Lepton charge
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l1.charge, 0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l2.charge, 0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l1.charge, 0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l2.charge, 0))])
    lepton_pfRelIso03_all:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Lepton PF RelIso03
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l1.pfRelIso03_all, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l2.pfRelIso03_all, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l1.pfRelIso03_all, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l2.pfRelIso03_all, 0.0))])
    lepton_sip3d:
      type: Regular
      bins: 50
      start: 0
      stop: 10
      label: Lepton SIP3D
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l1.sip3d, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l2.sip3d, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l1.sip3d, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l2.sip3d, 0.0))])
    lepton_is_tight:
      type: Integer
      start: 0
      stop: 2
      label: Lepton is tight
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l1.is_tight, False)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l2.is_tight, False)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l1.is_tight, False)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l2.is_tight, False))])
    lepton_mvaHZZIso:
      type: Regular
      bins: 50
      start: -1
      stop: 1
      label: Lepton mvaHZZIso
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l1.mvaHZZIso, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l2.mvaHZZIso, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l1.mvaHZZIso, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l2.mvaHZZIso, 0.0))])
    lepton_isPFcand:
      type: Integer
      start: 0
      stop: 2
      label: Lepton isPFcand
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l1.isPFcand, False)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l2.isPFcand, False)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l1.isPFcand, False)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l2.isPFcand, False))])
    lepton_highPtId:
      type: Integer
      start: 0
      stop: 3
      label: Lepton highPtId
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l1.highPtId, 0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l2.highPtId, 0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l1.highPtId, 0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l2.highPtId, 0))])

    # =========================================================================
    # MVA Truth Labels (4-class classification)
    # Labels are MUTUALLY EXCLUSIVE - each dataset gets exactly ONE label.
    # Class 0: qqZZ - qq→ZZ continuum background (ZZto4L only)
    # Class 1: ggZZ - gg→ZZ continuum background (GluGluToContinto2Z, GluGlutoContinto2Z)
    # Class 2: Signal - H+c signal (SomeSMSignal, HPlusCharm)
    # Class 3: Other_Higgs - Combined: HPlusB + ggH + VBF/ZH/WH/ttH/bbH
    # =========================================================================
    is_qqZZ:
      type: Integer
      start: 0
      stop: 2
      label: is_qqZZ
      expression: ak.ones_like(objects['best_zzcandidate'].p4.pt) * (1.0 if ('ZZto4L' in dataset and 'GluGluHtoZZ' not in dataset and 'GluGluToContinto2Z' not in dataset and 'GluGlutoContinto2Z' not in dataset and not ('SomeSMSignal' in dataset or 'HPlusCharm' in dataset) and not ('HPlusBottom' in dataset or 'HB_' in dataset or dataset.endswith('HB')) and not ('VBFHto' in dataset or 'ZHto' in dataset or 'WminusH' in dataset or 'WplusH' in dataset or 'TTH_' in dataset or 'bbH_' in dataset)) else 0.0)
    is_ggZZ:
      type: Integer
      start: 0
      stop: 2
      label: is_ggZZ
      expression: ak.ones_like(objects['best_zzcandidate'].p4.pt) * (1.0 if (('GluGluToContinto2Z' in dataset or 'GluGlutoContinto2Z' in dataset) and 'GluGluHtoZZ' not in dataset and not ('SomeSMSignal' in dataset or 'HPlusCharm' in dataset) and not ('HPlusBottom' in dataset or 'HB_' in dataset or dataset.endswith('HB')) and not ('VBFHto' in dataset or 'ZHto' in dataset or 'WminusH' in dataset or 'WplusH' in dataset or 'TTH_' in dataset or 'bbH_' in dataset)) else 0.0)
    is_Signal:
      type: Integer
      start: 0
      stop: 2
      label: is_Signal
      expression: ak.ones_like(objects['best_zzcandidate'].p4.pt) * (1.0 if (('SomeSMSignal' in dataset or 'HPlusCharm' in dataset) and not ('HPlusBottom' in dataset or 'HB_' in dataset or dataset.endswith('HB'))) else 0.0)
    is_Other_Higgs:
      type: Integer
      start: 0
      stop: 2
      label: is_Other_Higgs
      expression: ak.ones_like(objects['best_zzcandidate'].p4.pt) * (1.0 if (('HPlusBottom' in dataset or 'HB_' in dataset or dataset.endswith('HB') or 'GluGluHtoZZ' in dataset or 'VBFHto' in dataset or 'ZHto' in dataset or 'WminusH' in dataset or 'WplusH' in dataset or 'TTH_' in dataset or 'bbH_' in dataset) and not ('SomeSMSignal' in dataset or 'HPlusCharm' in dataset) and 'GluGluToContinto2Z' not in dataset and 'GluGlutoContinto2Z' not in dataset and not ('ZZto4L' in dataset and 'GluGluHtoZZ' not in dataset)) else 0.0)

  layout:
    zz_inclusive:
      - zz_mass_inclusive
      - zz_pt_inclusive
      - zz_eta_inclusive
      - deltaR_ZZ
    z_kinematics:
      - z1_pt
      - z1_eta
      - z1_mass
      - z2_pt
      - z2_eta
      - z2_mass
    zz_mass_4e:
      - zz_mass_4e
    zz_mass_4mu:
      - zz_mass_4mu
    zz_mass_2e2mu:
      - zz_mass_2e2mu
    zz_mass_2mu2e:
      - zz_mass_2mu2e
    jet_global:
      - jet_multiplicity
      - jet_ht
      - nSV
    jet:
      - jet_pt
      - jet_eta
      - jet_phi
    jet_tagging:
      - jet_btagPNetB
      - jet_btagPNetCvL
      - jet_btagPNetCvB
    leading_jet:
      - leadingjet_flavour
      - leadingjet_cvsl
      - leadingjet_cvsb
      - leadingjet_b
    subleading_jet:
      - subleadingjet_flavour
      - subleadingjet_cvsl
      - subleadingjet_cvsb
    cjet:
      - cjets_pt
      - cjets_eta
      - cjets_phi
      - cjets_h_dphi_inclusive
    leptons:
      - z1_l1_pt
      - z1_l2_pt
      - z2_l1_pt
      - z2_l2_pt
