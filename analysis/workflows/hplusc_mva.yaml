# H+c workflow with MVA-based c-tagging boundaries
#
# This workflow uses MVA-derived c-tagging boundaries from the HcZZ training:
#   law run TrainingTask --config hc_zzto4l_mw_training_enhanced
#                        --dataset-version hcZZ_2era_new60
#                        --model-name MLP_HcZZ_MW_Deep
#
# MVA boundaries define jet categories in 2D space (pBplusC, pBvsC):
#   Charm categories: C0 (very loose) -> C4 (high purity)
#   B-tag categories: B0 (loose) -> B4 (tight)
#   Light category:   L0
#
# To switch back to standard working points, change:
#   use_mva_boundaries=True  ->  remove the parameter (defaults to False)
#
# For specific MVA categories only (e.g., high-purity C3, C4):
#   working_points.jet_ctagging(events, 'medium', year, use_mva_boundaries=True, mva_categories=['C3', 'C4'])

datasets:
  data:
    - muon
    - double_muon
    - electron
    - double_electron
    - muon_electron
  mc:
    - higgs
    - hb
    - qqtozz
    - ggtozz
  signal:
    - smsignal
object_selection:
  muons:
    field: events.Muon
    add_cut:
      is_loose:
        - events.Muon.pt > 5
        - np.abs(events.Muon.eta) < 2.4
        - np.abs(events.Muon.dxy) < 0.5
        - np.abs(events.Muon.dz) < 1
        - events.Muon.isGlobal | events.Muon.isTracker
      is_relaxed:
        - objects['muons'].is_loose
        - np.abs(events.Muon.sip3d) < 4
      is_tight:
        - objects['muons'].is_loose
        - objects['muons'].is_relaxed
        - events.Muon.isPFcand | ((events.Muon.highPtId > 0) & (events.Muon.pt > 200))
  electrons:
    field: events.Electron
    add_cut:
      is_loose:
        - events.Electron.pt > 7
        - np.abs(events.Electron.eta) < 2.5
        - np.abs(events.Electron.dxy) < 0.5
        - np.abs(events.Electron.dz) < 1
      is_relaxed:
        - objects['electrons'].is_loose
        - np.abs(events.Electron.sip3d) < 4
      is_tight:
        - objects['electrons'].is_loose
        - objects['electrons'].is_relaxed
        - working_points.electron_id(events, 'bdt')
    cuts:
      - delta_r_higher(events.Electron, objects['muons'], 0.05)
  fsr_photons:
    field: events.FsrPhoton
    cuts:
      - events.FsrPhoton.pt > 2
      - np.abs(events.FsrPhoton.eta) < 2.4
      - events.FsrPhoton.relIso03 < 1.8
  leptons:
    field: select_zzto4l_leptons
  zcandidates:
    field: select_zcandidates
    add_cut:
      is_ossf:
        - objects['zcandidates'].l1.pdgId == -objects['zcandidates'].l2.pdgId
      is_sr:
        - objects['zcandidates'].is_ossf
        - objects['zcandidates'].l1.is_tight & objects['zcandidates'].l2.is_tight
    cuts:
      - (objects['zcandidates'].p4.mass > 12) & (objects['zcandidates'].p4.mass < 120)
  zzcandidates:
    field: select_zzcandidates
    cuts:
      - objects['zzcandidates'].z1.is_sr & objects['zzcandidates'].z2.is_sr
      - (objects['zzcandidates'].z1.p4 + objects['zzcandidates'].z2.p4).mass > 70
  best_zzcandidate:
    field: select_best_zzcandidate
  zz_mass_4mu:
    field: select_mass_4mu_sr
  zz_mass_4e:
    field: select_mass_4e_sr
  zz_mass_2mu2e:
    field: select_mass_2mu2e_sr
  zz_mass_2e2mu:
    field: select_mass_2e2mu_sr
  jets:
    field: events.Jet
    cuts:
      - events.Jet.pt > 20
      - np.abs(events.Jet.eta) < 2.5
      - working_points.jet_id(events, year, 'tightlepveto')
      - delta_r_higher(events.Jet, objects['leptons'], 0.4)
  # c-jets using MVA boundaries (all charm categories C0-C4)
  # This replaces the standard working point approach
  cjets:
    field: events.Jet
    cuts:
      - events.Jet.pt > 20
      - np.abs(events.Jet.eta) < 2.5
      - working_points.jet_id(events, year, 'tightlepveto')
      - delta_r_higher(events.Jet, objects['leptons'], 0.4)
      - working_points.jet_ctagging(events, 'medium', year, use_mva_boundaries=True)
  zzcandidate_cjet_dphi_inclusive:
    field: select_dphi_inclusive
  zzcandidate_cjet_dphi_4e:
    field: select_dphi_4e
  zzcandidate_cjet_dphi_4mu:
    field: select_dphi_4mu
  zzcandidate_cjet_dphi_2mu2e:
    field: select_dphi_2mu2e
  zzcandidate_cjet_dphi_2e2mu:
    field: select_dphi_2e2mu
event_selection:
  hlt_paths:
    - SingleMu
    - DiMu
    - TriMu
    - SingleEle
    - DiEle
    - MuEle
  selections:
    trigger: get_zzto4l_trigger_mask(events, hlt_paths, dataset, year)
    lumimask: get_lumi_mask(events, year)
    atleast_one_goodvertex: events.PV.npvsGood > 0
    atleast_one_zz: ak.num(objects['zzcandidates']) >= 1
    one_cjet: ak.num(objects['cjets']) == 1
  categories:
    base:
      - trigger
      - lumimask
      - atleast_one_goodvertex
      - atleast_one_zz
      - one_cjet
corrections:
  objects:
    - jec
    - jet_vetomaps
    - muon_ss
    - electon_ss
  event_weights:
    genWeight: true
    pileupWeight: true
    partonshowerWeight: true
    lhepdfWeight: true
    lhescaleWeight: true
    nnlopsWeight: true
    electron:
      - id: false
      - reco: true
      - trigger: false
    # Note: c-tagging scale factors are not applied when using MVA boundaries
    # as the MVA-based selection doesn't use standard working points
    # ctagging:
    #   - wp: medium
histogram_config:
  add_syst_axis: true
  add_weight: true
  axes:
    zz_mass_inclusive:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{4\ell}$ [GeV]
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).mass
    zz_pt_inclusive:
      type: Regular
      bins: 40
      start: 0
      stop: 400
      label: $p_T(4\ell)$ [GeV]
      expression: objects['best_zzcandidate'].p4.pt
    zz_eta_inclusive:
      type: Regular
      bins: 50
      start: -5
      stop: 5
      label: $\eta(4\ell)$
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).eta
    zz_phi_inclusive:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(4\ell)$
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).phi
    # Z1 kinematics
    z1_pt:
      type: Regular
      bins: 50
      start: 0
      stop: 500
      label: $p_T(Z_1)$ [GeV]
      expression: objects['best_zzcandidate'].z1.p4.pt
    z1_eta:
      type: Regular
      bins: 50
      start: -5
      stop: 5
      label: $\eta(Z_1)$
      expression: objects['best_zzcandidate'].z1.p4.eta
    z1_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(Z_1)$
      expression: objects['best_zzcandidate'].z1.p4.phi
    z1_mass:
      type: Regular
      bins: 54
      start: 12
      stop: 120
      label: $m(Z_1)$ [GeV]
      expression: objects['best_zzcandidate'].z1.p4.mass
    # Z2 kinematics
    z2_pt:
      type: Regular
      bins: 50
      start: 0
      stop: 500
      label: $p_T(Z_2)$ [GeV]
      expression: objects['best_zzcandidate'].z2.p4.pt
    z2_eta:
      type: Regular
      bins: 50
      start: -5
      stop: 5
      label: $\eta(Z_2)$
      expression: objects['best_zzcandidate'].z2.p4.eta
    z2_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(Z_2)$
      expression: objects['best_zzcandidate'].z2.p4.phi
    z2_mass:
      type: Regular
      bins: 54
      start: 12
      stop: 120
      label: $m(Z_2)$ [GeV]
      expression: objects['best_zzcandidate'].z2.p4.mass
    zz_mass_4mu:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{4\mu}$ [GeV]
      expression: objects['zz_mass_4mu']
    zz_mass_4e:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{4e}$ [GeV]
      expression: objects['zz_mass_4e']
    zz_mass_2mu2e:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{2\mu 2e}$ [GeV]
      expression: objects['zz_mass_2mu2e']
    zz_mass_2e2mu:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{2e2\mu}$ [GeV]
      expression: objects['zz_mass_2e2mu']
    jet_multiplicity:
      type: Integer
      start: 0
      stop: 14
      label: Jet Multiplicity
      expression: ak.num(objects['jets'])
    jet_pt:
      type: Regular
      bins: 50
      start: 20
      stop: 500
      label: Jets $p_T$ [GeV]
      expression: objects['jets'].pt
    jet_eta:
      type: Regular
      bins: 50
      start: -2.4
      stop: 2.4
      label: Jets $\eta$
      expression: objects['jets'].eta
    jet_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: Jets $\phi$
      expression: objects['jets'].phi
    leadingjet_cvsl:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Leading Jet CvsL
      expression: ak.pad_none(objects['jets'], target=2)[:, 0].btagUParTAK4CvL if hasattr(objects['jets'], 'btagUParTAK4CvL') else ak.pad_none(objects['jets'], target=2)[:, 0].btagPNetCvL if hasattr(objects['jets'], 'btagPNetCvL') else ak.pad_none(objects['jets'], target=2)[:, 0].btagDeepFlavCvL
    leadingjet_cvsb:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Leading Jet CvsB
      expression: ak.pad_none(objects['jets'], target=2)[:, 0].btagUParTAK4CvB if hasattr(objects['jets'], 'btagUParTAK4CvB') else ak.pad_none(objects['jets'], target=2)[:, 0].btagPNetCvB if hasattr(objects['jets'], 'btagPNetCvB') else ak.pad_none(objects['jets'], target=2)[:, 0].btagDeepFlavCvB
    leadingjet_flavour:
      type: IntCategory
      categories:
        - 0
        - 4
        - 5
      label: Leading Jet HadronFlavour
      expression: ak.pad_none(objects['jets'], target=2)[:, 0].hadronFlavour
    subleadingjet_cvsl:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Leading Jet CvsL
      expression: ak.pad_none(objects['jets'], target=2)[:, 1].btagUParTAK4CvL if hasattr(objects['jets'], 'btagUParTAK4CvL') else ak.pad_none(objects['jets'], target=2)[:, 1].btagPNetCvL if hasattr(objects['jets'], 'btagPNetCvL') else ak.pad_none(objects['jets'], target=2)[:, 1].btagDeepFlavCvL
    subleadingjet_cvsb:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Leading Jet CvsB
      expression: ak.pad_none(objects['jets'], target=2)[:, 1].btagUParTAK4CvB if hasattr(objects['jets'], 'btagUParTAK4CvB') else ak.pad_none(objects['jets'], target=2)[:, 1].btagPNetCvB if hasattr(objects['jets'], 'btagPNetCvB') else ak.pad_none(objects['jets'], target=2)[:, 1].btagDeepFlavCvB
    subleadingjet_flavour:
      type: IntCategory
      categories:
        - 0
        - 4
        - 5
      label: Subleading Jet HadronFlavour
      expression: ak.pad_none(objects['jets'], target=2)[:, 1].hadronFlavour
    cjets_pt:
      type: Regular
      bins: 50
      start: 20
      stop: 500
      label: MVA c-Jet $p_T$ [GeV]
      expression: objects['cjets'].pt
    cjets_eta:
      type: Regular
      bins: 50
      start: -2.4
      stop: 2.4
      label: MVA c-Jet $\eta$
      expression: objects['cjets'].eta
    cjets_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: MVA c-Jet $\phi$
      expression: objects['cjets'].phi
    cjets_h_dphi_inclusive:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{4\ell})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_inclusive'])
    cjets_h_dphi_4e:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{4e})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_4e'])
    cjets_h_dphi_4mu:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{4\mu})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_4mu'])
    cjets_h_dphi_2mu2e:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{2\mu 2e})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_2mu2e'])
    cjets_h_dphi_2e2mu:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{2e2\mu})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_2e2mu'])
    # Z1 lepton 1 kinematics
    z1_l1_pt:
      type: Regular
      bins: 50
      start: 5
      stop: 300
      label: $p_T(\ell_1^{Z_1})$ [GeV]
      expression: objects['best_zzcandidate'].z1.l1.pt
    z1_l1_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\ell_1^{Z_1})$
      expression: objects['best_zzcandidate'].z1.l1.eta
    z1_l1_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_1^{Z_1})$
      expression: objects['best_zzcandidate'].z1.l1.phi
    # Z1 lepton 1 IDs
    z1_l1_is_tight:
      type: Boolean
      label: $Z_1 \ell_1$ is_tight
      expression: objects['best_zzcandidate'].z1.l1.is_tight
    z1_l1_mvaHZZIso:
      type: Regular
      bins: 50
      start: -1
      stop: 1
      label: $Z_1 \ell_1$ mvaHZZIso
      expression: objects['best_zzcandidate'].z1.l1.mvaHZZIso
    z1_l1_isPFcand:
      type: Boolean
      label: $Z_1 \ell_1$ isPFcand
      expression: objects['best_zzcandidate'].z1.l1.isPFcand
    z1_l1_highPtId:
      type: Integer
      start: 0
      stop: 3
      label: $Z_1 \ell_1$ highPtId
      expression: objects['best_zzcandidate'].z1.l1.highPtId
    z1_l1_pfRelIso03_all:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: $Z_1 \ell_1$ pfRelIso03_all
      expression: objects['best_zzcandidate'].z1.l1.pfRelIso03_all
    # Z1 lepton 2 kinematics
    z1_l2_pt:
      type: Regular
      bins: 50
      start: 5
      stop: 300
      label: $p_T(\ell_2^{Z_1})$ [GeV]
      expression: objects['best_zzcandidate'].z1.l2.pt
    z1_l2_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\ell_2^{Z_1})$
      expression: objects['best_zzcandidate'].z1.l2.eta
    z1_l2_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_2^{Z_1})$
      expression: objects['best_zzcandidate'].z1.l2.phi
    # Z1 lepton 2 IDs
    z1_l2_is_tight:
      type: Boolean
      label: $Z_1 \ell_2$ is_tight
      expression: objects['best_zzcandidate'].z1.l2.is_tight
    z1_l2_mvaHZZIso:
      type: Regular
      bins: 50
      start: -1
      stop: 1
      label: $Z_1 \ell_2$ mvaHZZIso
      expression: objects['best_zzcandidate'].z1.l2.mvaHZZIso
    z1_l2_isPFcand:
      type: Boolean
      label: $Z_1 \ell_2$ isPFcand
      expression: objects['best_zzcandidate'].z1.l2.isPFcand
    z1_l2_highPtId:
      type: Integer
      start: 0
      stop: 3
      label: $Z_1 \ell_2$ highPtId
      expression: objects['best_zzcandidate'].z1.l2.highPtId
    z1_l2_pfRelIso03_all:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: $Z_1 \ell_2$ pfRelIso03_all
      expression: objects['best_zzcandidate'].z1.l2.pfRelIso03_all
    # Z2 lepton 1 kinematics
    z2_l1_pt:
      type: Regular
      bins: 50
      start: 5
      stop: 300
      label: $p_T(\ell_1^{Z_2})$ [GeV]
      expression: objects['best_zzcandidate'].z2.l1.pt
    z2_l1_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\ell_1^{Z_2})$
      expression: objects['best_zzcandidate'].z2.l1.eta
    z2_l1_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_1^{Z_2})$
      expression: objects['best_zzcandidate'].z2.l1.phi
    # Z2 lepton 1 IDs
    z2_l1_is_tight:
      type: Boolean
      label: $Z_2 \ell_1$ is_tight
      expression: objects['best_zzcandidate'].z2.l1.is_tight
    z2_l1_mvaHZZIso:
      type: Regular
      bins: 50
      start: -1
      stop: 1
      label: $Z_2 \ell_1$ mvaHZZIso
      expression: objects['best_zzcandidate'].z2.l1.mvaHZZIso
    z2_l1_isPFcand:
      type: Boolean
      label: $Z_2 \ell_1$ isPFcand
      expression: objects['best_zzcandidate'].z2.l1.isPFcand
    z2_l1_highPtId:
      type: Integer
      start: 0
      stop: 3
      label: $Z_2 \ell_1$ highPtId
      expression: objects['best_zzcandidate'].z2.l1.highPtId
    z2_l1_pfRelIso03_all:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: $Z_2 \ell_1$ pfRelIso03_all
      expression: objects['best_zzcandidate'].z2.l1.pfRelIso03_all
    # Z2 lepton 2 kinematics
    z2_l2_pt:
      type: Regular
      bins: 50
      start: 5
      stop: 300
      label: $p_T(\ell_2^{Z_2})$ [GeV]
      expression: objects['best_zzcandidate'].z2.l2.pt
    z2_l2_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\ell_2^{Z_2})$
      expression: objects['best_zzcandidate'].z2.l2.eta
    z2_l2_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_2^{Z_2})$
      expression: objects['best_zzcandidate'].z2.l2.phi
    # Z2 lepton 2 IDs
    z2_l2_is_tight:
      type: Boolean
      label: $Z_2 \ell_2$ is_tight
      expression: objects['best_zzcandidate'].z2.l2.is_tight
    z2_l2_mvaHZZIso:
      type: Regular
      bins: 50
      start: -1
      stop: 1
      label: $Z_2 \ell_2$ mvaHZZIso
      expression: objects['best_zzcandidate'].z2.l2.mvaHZZIso
    z2_l2_isPFcand:
      type: Boolean
      label: $Z_2 \ell_2$ isPFcand
      expression: objects['best_zzcandidate'].z2.l2.isPFcand
    z2_l2_highPtId:
      type: Integer
      start: 0
      stop: 3
      label: $Z_2 \ell_2$ highPtId
      expression: objects['best_zzcandidate'].z2.l2.highPtId
    z2_l2_pfRelIso03_all:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: $Z_2 \ell_2$ pfRelIso03_all
      expression: objects['best_zzcandidate'].z2.l2.pfRelIso03_all
  layout:
    zz_inclusive:
      - zz_mass_inclusive
      - zz_pt_inclusive
    zz_mass_4e:
      - zz_mass_4e
    zz_mass_4mu:
      - zz_mass_4mu
    zz_mass_2e2mu:
      - zz_mass_2e2mu
    zz_mass_2mu2e:
      - zz_mass_2mu2e
    jet_multiplicity:
      - jet_multiplicity
    jet:
      - jet_pt
      - jet_eta
      - jet_phi
    leading_jet:
      - leadingjet_flavour
      - leadingjet_cvsl
      - leadingjet_cvsb
    subleading_jet:
      - subleadingjet_flavour
      - subleadingjet_cvsl
      - subleadingjet_cvsb
    cjet:
      - cjets_pt
      - cjets_eta
      - cjets_phi
    cjets_h_dphi_inclusive:
      - cjets_h_dphi_inclusive
    cjets_h_dphi_4e:
      - cjets_h_dphi_4e
    cjets_h_dphi_4mu:
      - cjets_h_dphi_4mu
    cjets_h_dphi_2mu2e:
      - cjets_h_dphi_2mu2e
    cjets_h_dphi_2e2mu:
      - cjets_h_dphi_2e2mu
